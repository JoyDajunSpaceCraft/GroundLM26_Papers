name: ACL publication check

on:
  workflow_dispatch:
    inputs:
      force:
        description: Recheck every paper even when its PDF hash is unchanged
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "all_papers/*/paper.pdf"
      - "src/groundlm_collector/check_collection.py"
      - "src/groundlm_collector/pubcheck.py"
      - "src/groundlm_collector/cli.py"
      - "src/groundlm_collector/report.py"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/aclpubcheck.yml"

concurrency:
  group: aclpubcheck-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-papers:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and official aclpubcheck
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m pip install "git+https://github.com/acl-org/aclpubcheck.git@237bee3a554f2d2fcda69cd0cf1edf4168e3d339"

      - name: Run unit tests
        run: python -m pytest -q

      - name: Check changed papers
        env:
          FORCE_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          if [[ "$FORCE_CHECK" == "true" ]]; then
            groundlm-collect check --force --logs-dir aclpubcheck-logs
          else
            groundlm-collect check --logs-dir aclpubcheck-logs
          fi

      - name: Upload full checker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aclpubcheck-logs-${{ github.run_id }}
          path: aclpubcheck-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit CSV results
        if: ${{ success() }}
        run: |
          if git diff --quiet -- papers.csv; then
            echo "papers.csv is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- papers.csv
          git commit -m "Update aclpubcheck results"
          git push
