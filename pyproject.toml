[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "groundlm-camera-ready"
version = "0.1.0"
description = "Collect GroundLM 2026 archival papers and run ACL pubcheck"
requires-python = ">=3.10"
dependencies = [
  "openreview-py>=2.6,<3",
]

[project.scripts]
groundlm-collect = "groundlm_collector.cli:main"
groundlm-notify = "groundlm_collector.notify_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
